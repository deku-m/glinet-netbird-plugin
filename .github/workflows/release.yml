name: Release

# Push a tag like v1.2.0 to build the package and publish a GitHub release.
# Routers with this repo as update source then see the update in
# Applications > NetBird > Maintenance.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check shell scripts
        run: |
          sudo apt-get install -y -qq shellcheck >/dev/null
          shellcheck -s sh -e SC1091,SC2034,SC2154,SC3043 \
            luci-app-netbird/root/usr/libexec/netbird-luci \
            luci-app-netbird/root/etc/init.d/netbird \
            luci-app-netbird/CONTROL/postinst luci-app-netbird/CONTROL/prerm luci-app-netbird/CONTROL/postrm build.sh
          node --check luci-app-netbird/oui/gl-sdk4-ui-netbird.common.js

      - name: Build
        run: ./build.sh "${GITHUB_REF_NAME#v}" "$GITHUB_REPOSITORY"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
