name: Release

# Two ways to release, both end with the .ipk and SHA256SUMS on the release:
#  - push a tag like v1.2.4 (a release is created for it), or
#  - publish a release with a new v1.2.4 tag on GitHub (assets are added to it).
# Routers with this repo as update source then see the update in
# Applications > NetBird > Maintenance.
on:
  push:
    tags: ['v*']
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Check shell scripts
        run: |
          sudo apt-get install -y -qq shellcheck >/dev/null
          shellcheck -s sh -e SC1091,SC2034,SC2154,SC3043 \
            luci-app-netbird/root/usr/libexec/netbird-luci \
            luci-app-netbird/root/etc/init.d/netbird \
            luci-app-netbird/CONTROL/postinst luci-app-netbird/CONTROL/prerm luci-app-netbird/CONTROL/postrm build.sh
          node --check luci-app-netbird/oui/gl-sdk4-ui-netbird.common.js

      - name: Build
        run: ./build.sh "${TAG#v}" "$GITHUB_REPOSITORY"

      - name: Publish
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "$TAG" --generate-notes
          fi
